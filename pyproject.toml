[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "golden-rules-obsidian"
version = "3.0.0"
description = "Zero-dependency working memory & hub-and-spoke knowledge architecture for AI coding agents (Claude Code, Cursor, OpenClaw, Antigravity)."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Fahrurosadi Hernan", email = "fahruhernansakti@gmail.com" }
]
keywords = [
    "obsidian",
    "ai-agents",
    "working-memory",
    "claude-code",
    "cursor",
    "antigravity",
    "openclaw",
    "zero-dependency",
    "devlog"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Documentation"
]
requires-python = ">=3.10"
dependencies = []

[project.scripts]
golden-rules-obsidian = "core.cli:main"
gro = "core.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["core*"]
