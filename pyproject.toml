[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "golden-rules-obsidian"
version = "1.0.0"
description = "Production-grade persistent working memory & hub-and-spoke knowledge architecture for AI coding agents."
readme = "README.md"
authors = [
    { name = "Fahrurosadi Hernan", email = "fahruhernansakti@gmail.com" }
]
license = { text = "MIT" }
keywords = [
    "obsidian",
    "ai-agents",
    "working-memory",
    "knowledge-graph",
    "llm-council",
    "antigravity",
    "claude-code",
    "cursor",
    "mcp",
    "clean-architecture"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Archiving"
]
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0"
]

[project.scripts]
golden-rules-obsidian = "scripts.cli:main"
gro = "scripts.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "providers*", "scripts*"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
